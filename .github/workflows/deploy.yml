name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "projects.html"
      - "projects/**"
      - "assets/**"
      - "sitemap.xml"
      - "robots.txt"
      - "Dockerfile"
      - "nginx.conf"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and roll out
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package site
        run: |
          tar -czf /tmp/site.tar.gz \
            --exclude=.git \
            --exclude=.archive \
            --exclude=.github \
            --exclude=deploy/certs \
            .
          ls -lh /tmp/site.tar.gz

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo connected as \$(whoami)"

      - name: Upload archive
        run: |
          scp -o BatchMode=yes /tmp/site.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/site.tar.gz"

      - name: Roll out container
        run: |
          ssh -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            sudo tar -xzf /tmp/site.tar.gz -C /opt/odin-portfolio
            sudo chown -R ubuntu:ubuntu /opt/odin-portfolio
            cd /opt/odin-portfolio
            docker compose up -d --build
            docker image prune -f --filter "until=168h"
          '

      - name: Health check
        run: |
          ssh -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || true)
              if [ "$code" = "200" ]; then
                echo "upstream healthy: HTTP $code"
                exit 0
              fi
              sleep 3
            done
            echo "health check failed, last code: $code"
            docker compose -f /opt/odin-portfolio/docker-compose.yml ps
            docker compose -f /opt/odin-portfolio/docker-compose.yml logs --tail 40
            exit 1
          '

      - name: Verify public endpoint
        run: |
          ssh -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            curl -sI https://lowtighter.icu | head -1
            curl -sI https://lowtighter.icu | grep -i strict-transport || true
          '
