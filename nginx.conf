server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ── gzip ────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml application/javascript
        application/json application/xml image/svg+xml
        font/woff2 application/manifest+json;

    # ── security headers ────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Uncomment once you are on HTTPS (see README §6):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── routing ─────────────────────────────────────────────
    # One page, no client-side router — so a wrong path is a real 404,
    # not index.html with a 200 glued on top.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fonts & images: long cache. They change almost never; if you do
    # replace one, rename the file (or bump the query string in HTML).
    location ~* ^/assets/.+\.(woff2|png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # CSS & JS: revalidate every load. ETag makes it a cheap 304, and it
    # means your edits appear the moment you deploy — no hard refresh.
    location ~* ^/assets/.+\.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # HTML must revalidate too, otherwise edits never show up.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }

    # Block dotfiles (.git, .env …) if anything ever leaks into the image
    location ~ /\.(?!well-known) { deny all; }
}
